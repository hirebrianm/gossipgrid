# GitHub Actions — GossipGrid CI
#
# Runs on pushes to main, development branches, and pull requests.
# No Docker image builds; no reference to private GitLab infrastructure.
# FIPS-enabled builds by default (FIPS_MODULE=v1.0.0).

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  GOSEC_VERSION: "v2.30.0"
  GOLDMARK_LINT_VERSION: "v0.6.3"
  FIPS_MODULE: "v1.0.0"

jobs:
  qa:
    name: QA (fmt, vet, lint, security, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.1.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Install goldmark-lint
        run: go install github.com/mrueg/goldmark-lint/cmd/goldmark-lint@${GOLDMARK_LINT_VERSION}

      - name: Run make qa
        run: make qa

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.1.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      - name: Build
        run: make build

      - name: Verify binary
        run: |
          file bin/gossipgrid
          test -x bin/gossipgrid && echo "Binary is executable"

      - name: Upload binary artifact
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gossipgrid-binary
          path: bin/gossipgrid
          if-no-files-found: error

# Application read-only metadata RBAC (Milestone 5B, Stage 1B).
#
# A namespaced Role and RoleBinding bound to the APPLICATION ServiceAccount
# (serviceAccount.name) granting read-only access to the authoritative
# cluster-metadata ConfigMap (gossipgrid-cluster-metadata). The application
# uses this to read the metadata record (k8smetadata provider) for lifecycle
# enforcement (genesis authorization, finalization observation, epoch
# fencing). The application is READ-ONLY: it never writes the ConfigMap
# (the genesis grant and finalization Jobs are separate, operator-triggered
# identities with their own RBAC).
#
# Security properties (enforced here):
#   - Namespaced only: NO ClusterRole, NO cluster-scoped bindings. The
#     read permission is bounded to the application namespace.
#   - get on the NAMED ConfigMap only (resourceNames IS honored for get, so
#     this is correctly scoped to gossipgrid-cluster-metadata). The
#     application performs a single Get per poll interval; it never lists,
#     watches, creates, updates, deletes, or patches the ConfigMap.
#   - NO update, create, delete, patch, list, or watch permissions. The
#     application is a read-only observer; the write permissions live in the
#     SEPARATE genesis grant RBAC (genesis-rbac.yaml: create) and the
#     SEPARATE finalization RBAC (finalize-rbac.yaml: update).
#   - The subject is the application ServiceAccount (serviceAccount.name),
#     NOT the separate genesis or finalization ServiceAccounts. The
#     application pods use this identity to read the ConfigMap; the grant
#     and finalization Jobs use their own distinct identities.
#
# This RBAC is DISABLED by default (lifecycle.metadataKubernetes.enabled:
# false). It is rendered only when an operator explicitly enables the
# Kubernetes metadata provider (via an override values file, NOT the 7A
# staging values) to support lifecycle enforcement in the running
# application. The RBAC must not leak into the default rendering.
#
# The Role and RoleBinding use distinct names (lifecycle.metadataKubernetes
# .roleName / .roleBindingName) to avoid collision with the genesis and
# finalization Role/RoleBinding names.
{{- if .Values.lifecycle.metadataKubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.lifecycle.metadataKubernetes.roleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gossipgrid
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "-" }}
rules:
  # get on the NAMED ConfigMap only (resourceNames is honored for get). The
  # application reads the authoritative record on a poll interval (the
  # k8smetadata provider); it never lists or watches.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.lifecycle.metadataKubernetes.configMapName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.lifecycle.metadataKubernetes.roleBindingName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gossipgrid
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.lifecycle.metadataKubernetes.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}

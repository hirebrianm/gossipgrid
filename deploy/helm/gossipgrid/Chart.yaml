apiVersion: v2
name: gossipgrid
description: >-
  GossipGrid is a Kubernetes distributed systems testbed — a Go-based
  multi-replica service with gossip replication, anti-entropy, peer mTLS,
  and browser password authentication. Milestone 7A: initial Kubernetes
  staging with lifecycle enforcement disabled (Milestones 5B/5C not yet
  implemented).
